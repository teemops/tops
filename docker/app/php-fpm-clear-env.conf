; Teemops php-fpm pool override.
;
; php-fpm's default `clear_env = yes` wipes the environment for FPM worker
; processes, so web requests would NOT see the container environment that
; docker-compose provides (compose `environment:` + `env_file:`), even though
; CLI processes (queue workers, scheduler, artisan) do.
;
; That split breaks two things for web requests:
;   1. The AWS SDK can't see AWS_SHARED_CREDENTIALS_FILE / AWS_PROFILE, so it
;      falls back to the EC2 instance metadata service (169.254.169.254) for
;      credentials — which times out off-EC2 — breaking SQS dispatch when a
;      scan is created.
;   2. Values from generated/teemops.env (e.g. SCAN_QUEUE_CONNECTION, queue
;      ARNs) never reach the web tier, so web and CLI can resolve different
;      config.
;
; Loaded as zz-*.conf so it applies after the default www.conf pool.
[www]
clear_env = no
