[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord-worker.pid

[unix_http_server]
file=/run/supervisor-worker.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor-worker.sock

[program:tops-queue]
; Also listens on the scan queues so that if a scan connection is left on
; 'database' while SQS workers are running, those jobs are still consumed
; rather than sitting in the jobs table forever.
command=php artisan queue:work database --queue=default,teemops_audit,teemops_audit_region --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tops-account-queue]
command=php artisan aws:process-sqs
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; NOTE: Scan processing runs on the local 'database' queue (see generated/teemops.env:
; SCAN_QUEUE_CONNECTION=database). The 'tops-queue' worker above already consumes the
; default, teemops_audit and teemops_audit_region queues on the database connection,
; so no dedicated SQS scan workers are needed. SQS is used only for account linking,
; handled by 'tops-account-queue' (aws:process-sqs).
; If you ever move scans back onto SQS (SCAN_QUEUE_CONNECTION=sqs-audit), re-add
; queue:work workers for the sqs-audit and sqs-audit-region connections here.

[program:tops-scheduler]
command=php artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
