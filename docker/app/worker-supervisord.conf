[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord-worker.pid

[unix_http_server]
file=/run/supervisor-worker.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor-worker.sock

; Two pools, deliberately. Region jobs vastly outnumber orchestrator jobs — roughly
; 153 per full scan against one — and a single pool means the long-running orchestrator
; occupies a worker that region jobs are queued behind. Splitting them lets the region
; pool scale without giving the orchestrator more processes than it can use.
[program:tops-queue]
command=php artisan queue:work database --queue=default,teemops_audit --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The pool that actually decides how long a scan takes. Safe to run concurrently: the
; database queue driver uses SELECT ... FOR UPDATE SKIP LOCKED on the MySQL 8 that
; docker-compose pins, so workers do not collide on the same job, and scan completion is
; settled by a job batch rather than by workers racing a counter (#65).
;
; Each process holds the AWS SDK (~60-120 MB) and one MySQL connection, so the default of
; 5 costs roughly 0.6-0.8 GB across this pool. Raise TOPS_WORKER_PROCESSES only with the
; memory and the AWS API rate limits to match.
[program:tops-region-queue]
command=php artisan queue:work database --queue=teemops_audit_region --sleep=3 --tries=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_TOPS_WORKER_PROCESSES)s
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Account linking is the only thing that genuinely needs SQS, so it does not start on a
; deployment without it — otherwise this restart-loops and buries the real logs. The
; entrypoint decides.
[program:tops-account-queue]
command=php artisan aws:process-sqs
directory=/var/www/html
autostart=%(ENV_TOPS_ACCOUNT_QUEUE_AUTOSTART)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:tops-scheduler]
command=php artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
