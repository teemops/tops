name: Tests

# Informational only. These jobs report build status on PRs and on develop; they
# are not intended to be added to the branch-protection "required checks" list.
on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  phpunit:
    name: PHP tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # pdo_sqlite backs the in-memory test database configured in phpunit.xml;
          # pcov is the coverage driver.
          extensions: bcmath, mbstring, pdo_sqlite, sqlite3, sockets, zip
          coverage: pcov
          ini-values: memory_limit=512M

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # Services and rules are contributed as JSON, and both fail quietly when wrong:
      # a rule aimed at data no tasks.json collects never matches anything, which looks
      # exactly like a compliant account. This checks them offline, with no AWS calls.
      - name: Validate scan definitions
        run: php artisan scan:validate-rules

      - name: Run tests
        run: php artisan test --coverage-clover=coverage.xml

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.xml ]; then
            echo "No coverage report produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          php -r '
            $xml = simplexml_load_file("coverage.xml");
            $m = $xml->project->metrics;
            $lines = (int) $m["statements"];
            $covered = (int) $m["coveredstatements"];
            $methods = (int) $m["methods"];
            $coveredMethods = (int) $m["coveredmethods"];
            $pct = fn ($c, $t) => $t > 0 ? round($c / $t * 100, 2) : 0;
            $summary = "## Coverage\n\n"
              . "| Metric | Covered | Total | % |\n"
              . "| --- | ---: | ---: | ---: |\n"
              . "| Lines | {$covered} | {$lines} | " . $pct($covered, $lines) . "% |\n"
              . "| Methods | {$coveredMethods} | {$methods} | " . $pct($coveredMethods, $methods) . "% |\n";
            file_put_contents(getenv("GITHUB_STEP_SUMMARY"), $summary, FILE_APPEND);
          '

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: app/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  install-secrets:
    name: Installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Repo root, not app/ — this exercises install.sh and docker-compose.yml.
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      # No containers are started; `docker compose config` is used to prove the
      # stack refuses to come up with a database password missing.
      - name: Check generated database passwords
        run: tests/install-secrets.test.sh

      # The AWS CLI is stubbed, so nothing here calls AWS or costs anything.
      - name: Check the install flow
        run: tests/install-flow.test.sh

      # The AWS installer reads .env without executing it, and reports what AWS
      # actually said when a call fails (issue #56). The CLI is stubbed and no
      # stack is deployed.
      - name: Check the AWS installer's input handling
        run: tests/install-messaging.test.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Ziggy publishes its route helper from the Composer package, and the
      # type-check step of `npm run build` imports it, so the frontend build
      # needs vendor/ present.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, sockets, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: app/vendor
          key: composer-${{ runner.os }}-php8.3-${{ hashFiles('app/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php8.3-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # No --force and no --legacy-peer-deps: a clean checkout must install as
      # published, and this job is what keeps it that way.
      - name: Install frontend dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Critical only, deliberately. The high and moderate advisories are a known
      # backlog (roadmap X-7) and gating on them would leave the job permanently
      # red, which teaches everyone to ignore it. Criticals are at zero, and this
      # is what keeps them there.
      - name: Audit dependencies
        run: npm audit --audit-level=critical

  docs:
    name: Docs site build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Repo root, not app/ — mkdocs.yml and user-docs/ both live there.
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install MkDocs Material
        run: pip install -r requirements.txt

      # --strict turns a broken nav entry, a dead cross-reference mkdocs itself
      # can see, or a missing page into a failed build instead of a silently
      # broken link on docs.teemops.com.
      - name: Build docs.teemops.com
        run: mkdocs build --strict

      # user-docs/README.md's own link-checker, for the relative links mkdocs
      # doesn't validate because they point at pages not yet in the nav.
      - name: Check user-docs cross-references
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          bad = []
          for md in pathlib.Path("user-docs").rglob("*.md"):
              text = re.sub(r"```.*?```", "", md.read_text(), flags=re.S)
              for m in re.finditer(r"\]\((?!https?:|#)([^)#]+)(#[^)]*)?\)", text):
                  if not (md.parent / m.group(1)).resolve().exists():
                      bad.append(f"{md}: -> {m.group(1)}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("all relative links resolve")
          EOF

      # SVGs fail as a silent broken image, not a build error — see
      # user-docs/README.md's Diagrams section.
      - name: Validate diagram SVGs
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET, glob
          [ET.parse(f) for f in glob.glob('user-docs/assets/diagrams/*.svg')]
          print('all diagrams parse as valid XML')
          "
