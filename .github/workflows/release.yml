name: Release

# Cuts a release whenever `develop` moves and the test suite passed.
#
# Steps, in order:
#   1. Bump the patch version in VERSION (unless VERSION was bumped by hand,
#      in which case that value is used as-is).
#   2. Tag v<version> and cut the GitHub release — that gives the downloadable
#      source zip for free.
#   3. Build and push the three images to Docker Hub, for amd64 and arm64.
#
# It is gated on the Tests workflow: `workflow_run` fires after Tests finishes,
# and the job exits early unless the conclusion was success. A red build
# publishes nothing.
#
# Re-running against an unchanged VERSION is a no-op — the tag already exists.
#
# `latest` tracks `develop`: every release here moves it. That is deliberate —
# there is no separate stable channel, and `develop` is the integration branch.
# The safety net is that install.sh pins TOPS_IMAGE_TAG to the version it
# installed, so users do not silently float onto a newer build; moving forward
# is an explicit `docker compose pull`.
#
# Requires two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a scoped Docker Hub access token, never an account password).

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semver bump applied to VERSION"
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_IMAGE: teem/tops
  BACKUP_IMAGE: teem/tops-backup
  INSTALLER_IMAGE: teem/tops-installer

jobs:
  release:
    name: Tag, release, and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Publishing is skipped unless the tests that triggered this actually passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Compute the next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type || 'patch' }}
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < VERSION)"

          # A hand-edited VERSION with no matching tag ships as-is; otherwise
          # bump automatically. That keeps "every merge releases" true without
          # taking away deliberate minor and major bumps.
          if git rev-parse "v$CURRENT" >/dev/null 2>&1; then
            IFS=. read -r major minor patch <<<"$CURRENT"
            case "$RELEASE_TYPE" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            NEXT="${major}.${minor}.${patch}"
            echo "VERSION $CURRENT is already tagged — bumping to $NEXT"
          else
            NEXT="$CURRENT"
            echo "VERSION $CURRENT has no tag yet — releasing it as-is"
          fi

          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, mbstring, sockets, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The app image expects app/vendor and app/public/build to exist — the
      # same contract contributors satisfy locally. The runner has PHP and Node,
      # so this reuses the existing script rather than duplicating the build
      # inside the Dockerfile.
      - name: Build host artifacts
        run: ./docker/scripts/prepare-build.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the backup image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.BACKUP_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.BACKUP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the installer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/installer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.INSTALLER_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.INSTALLER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Everything below only runs once all three images are pushed. Tagging
      # first would mean a failed image build leaves a dangling tag: the next
      # run would see v<version> already exists, bump past it, and that version
      # would be burned forever with nothing published under it.
      - name: Write VERSION and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # [skip ci] stops this push re-triggering Tests, which would in turn
          # re-trigger this workflow.
          if [ "$(tr -d '[:space:]' < VERSION)" != "$VERSION" ]; then
            echo "$VERSION" > VERSION
            git add VERSION
            git commit -m "chore(release): v$VERSION [skip ci]"
            git push origin develop
          fi

      - name: Create the tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Cut the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target develop \
            --title "$TAG" \
            --generate-notes

      - name: Summary
        run: |
          {
            echo "### Released ${{ steps.version.outputs.tag }}"
            echo
            echo "| Image | Tags |"
            echo "| --- | --- |"
            echo "| \`${{ env.APP_IMAGE }}\` | \`${{ steps.version.outputs.tag }}\`, \`latest\` |"
            echo "| \`${{ env.BACKUP_IMAGE }}\` | \`${{ steps.version.outputs.tag }}\`, \`latest\` |"
            echo "| \`${{ env.INSTALLER_IMAGE }}\` | \`${{ steps.version.outputs.tag }}\`, \`latest\` |"
            echo
            echo "Install: \`bash <(curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh)\`"
          } >> "$GITHUB_STEP_SUMMARY"
