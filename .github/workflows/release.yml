name: Prepare release

# Phase 1 of the release process.
#
# Bumps VERSION, writes the CHANGELOG.md entry, and opens a release pull request
# against `develop`. It deliberately does NOT push to `develop`, tag, or publish
# anything — that keeps `develop` a PR-only branch and puts a human review in
# front of every release.
#
# When the release PR is merged, `.github/workflows/tag-release.yml` takes over:
# it builds and pushes the images, creates the `v<version>` tag, and cuts the
# GitHub release. Tags live in refs/tags/* and are not subject to branch
# protection, so that step works even with `develop` locked down.
#
# Tests are not re-run here. The release PR is an ordinary pull request, so the
# Tests workflow runs against it — merging a red release PR is a human decision,
# not something this workflow can paper over.
#
# Run it from the Actions tab ("Run workflow"), pick a release type, or give an
# explicit version to override the automatic bump.
#
# RELEASE_TOKEN (optional repository secret, a PAT with `repo` scope): pull
# requests opened with the default GITHUB_TOKEN do not trigger other workflows,
# so without it the release PR opens with no Tests run attached and you have to
# push an empty commit or re-run Tests by hand to get a green check.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Semver bump applied to VERSION"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      version:
        description: "Explicit version (e.g. 1.2.3). Overrides release_type when set."
        type: string
        required: false
        default: ""
      dry_run:
        description: "Preview the release without opening a pull request"
        type: boolean
        default: false

concurrency:
  group: release-prepare
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Open release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Compute the next version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          set -euo pipefail
          CURRENT="$(tr -d '[:space:]' < VERSION)"

          if [ -n "$INPUT_VERSION" ]; then
            NEXT="$(printf '%s' "$INPUT_VERSION" | sed 's/^v//')"
          else
            IFS=. read -r major minor patch <<<"$CURRENT"
            case "$RELEASE_TYPE" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            NEXT="${major}.${minor}.${patch}"
          fi

          if [ "$CURRENT" = "$NEXT" ]; then
            echo "::error::Next version ($NEXT) is the same as the current version ($CURRENT)."
            exit 1
          fi

          if ! printf '%s' "$NEXT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$NEXT' is not a x.y.z version."
            exit 1
          fi

          if git rev-parse "v$NEXT" >/dev/null 2>&1; then
            echo "::error::Tag v$NEXT already exists."
            exit 1
          fi

          {
            echo "current=$CURRENT"
            echo "next=$NEXT"
            echo "tag=v$NEXT"
            echo "branch=release/v$NEXT"
          } >> "$GITHUB_OUTPUT"

          echo "Preparing release $CURRENT -> $NEXT (tag v$NEXT)"

      - name: Write VERSION
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: echo "$NEXT" > VERSION

      # The changelog is assembled from the pull requests merged into develop
      # since the last tag. That is the honest record of what shipped, and it
      # needs no commit-message convention to be enforced.
      - name: Generate the changelog entry
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PREVIOUS_TAG="$(git tag --sort=-v:refname | head -n 1 || true)"
          RELEASE_DATE="$(date -u +%Y-%m-%d)"

          if [ -n "$PREVIOUS_TAG" ]; then
            SINCE_ISO="$(git log -1 --format=%aI "$PREVIOUS_TAG")"
            echo "Collecting pull requests merged since $PREVIOUS_TAG ($SINCE_ISO)"
            PR_JSON="$(
              gh pr list \
                --repo "${{ github.repository }}" \
                --state merged \
                --base develop \
                --limit 200 \
                --json number,title,url,mergedAt,author \
                --search "merged:>=$SINCE_ISO"
            )"
            PR_JSON="$(echo "$PR_JSON" | jq --arg since "$SINCE_ISO" '
              [ .[] | select(.mergedAt > $since) ] | sort_by(.mergedAt)
            ')"
          else
            echo "First release — collecting every merged pull request"
            PR_JSON="$(
              gh pr list \
                --repo "${{ github.repository }}" \
                --state merged \
                --base develop \
                --limit 200 \
                --json number,title,url,mergedAt,author
            )"
            PR_JSON="$(echo "$PR_JSON" | jq 'sort_by(.mergedAt)')"
          fi

          {
            echo "## [$TAG] - $RELEASE_DATE"
            echo
            if [ "$(echo "$PR_JSON" | jq 'length')" -eq 0 ]; then
              echo "- Maintenance release."
            else
              echo "$PR_JSON" | jq -r '.[] | "- \(.title) ([#\(.number)](\(.url))) (@\(.author.login))"'
            fi
            echo
          } > /tmp/release-entry.md

          echo "Generated changelog entry:"
          cat /tmp/release-entry.md

      - name: Prepend the entry to CHANGELOG.md
        run: |
          set -euo pipefail
          if [ ! -f CHANGELOG.md ]; then
            printf '# Changelog\n\n' > CHANGELOG.md
          fi
          tmp="$(mktemp)"
          cat /tmp/release-entry.md CHANGELOG.md > "$tmp"
          mv "$tmp" CHANGELOG.md

      - name: Open the release pull request
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          BRANCH: ${{ steps.version.outputs.branch }}
          TAG: ${{ steps.version.outputs.tag }}
          NEXT: ${{ steps.version.outputs.next }}
          CURRENT: ${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add -A
          if git diff --staged --quiet; then
            echo "::error::No release changes to commit."
            exit 1
          fi
          git commit -m "chore(release): $TAG"
          git push --force-with-lease origin "$BRANCH"

          BODY="$(cat <<EOF
          Automated release prepared by the **Prepare release** workflow.

          - Version: \`$CURRENT\` → \`$NEXT\`
          - Tag cut on merge: \`$TAG\`

          Merging this PR triggers \`tag-release.yml\`, which:

          1. Builds and pushes \`teem/tops\`, \`teem/tops-backup\` and \`teem/tops-installer\`
             for amd64 and arm64, tagged \`$TAG\` and \`latest\`.
          2. Creates the annotated tag \`$TAG\` (tags are not blocked by branch protection).
          3. Cuts the GitHub release for \`$TAG\`, using this changelog entry as the notes.

          Check that Tests is green and the CHANGELOG.md entry reads correctly, then merge to ship.
          EOF
          )"

          if EXISTING="$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --json url --jq '.[0].url')" && [ -n "$EXISTING" ]; then
            echo "Updating the existing release PR: $EXISTING"
            gh pr edit "$EXISTING" --title "chore(release): $TAG" --body "$BODY"
          else
            URL="$(gh pr create \
              --repo "${{ github.repository }}" \
              --base develop \
              --head "$BRANCH" \
              --title "chore(release): $TAG" \
              --body "$BODY")"
            echo "Opened the release PR: $URL"
          fi

      - name: Summary
        run: |
          {
            echo "### Release prepared: ${{ steps.version.outputs.tag }}"
            echo
            echo "- Previous version: \`${{ steps.version.outputs.current }}\`"
            echo "- New version: \`${{ steps.version.outputs.next }}\`"
            echo "- Release branch: \`${{ steps.version.outputs.branch }}\`"
            echo "- Dry run: \`${{ inputs.dry_run }}\`"
            echo
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "Dry run — no pull request was opened."
            else
              echo "Merge the release PR to build the images, cut the tag, and publish the GitHub release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
