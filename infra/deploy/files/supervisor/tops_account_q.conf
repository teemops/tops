#supervisor file for tops-api
[program:tops-account-queue]
process_name=%(program_name)s_%(process_num)02d
command=php artisan aws:process-sqs --sleep=3 --tries=3 --max-time=3600
numprocs=1
autostart=true
autorestart=true
delay=15
stderr_logfile=/var/log/tops-account-queue.err.log
stdout_logfile=/var/log/tops-account-queue.out.log
directory=/srv/apps/tops/app
redirect_stderr=true
user=www-data
