#supervisor file for tops-api
[program:tops-scan-region-queue]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work sqs-audit-region --queue=teemops_audit_region --sleep=3 --tries=3 --max-time=3600
numprocs=8
autostart=true
autorestart=true
delay=15
stderr_logfile=/var/log/tops-scan-region-queue.err.log
stdout_logfile=/var/log/tops-scan-region-queue.out.log
directory=/srv/apps/tops
redirect_stderr=true
user=www-data
