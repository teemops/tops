## Template for IAM Role
AWSTemplateFormatVersion: "2010-09-09"
Description: "IAM role for an account to be accessed by Teemops Parent AWS Account"
Parameters:
  # Parent AWS Account
  ParentAWSAccountId:
    Type: String
    Description: "The AWS Account ID of the Teemops root account (supplied by the app via the quick-create URL)"
    AllowedPattern: "[0-9]{12}"
    MinLength: 12
    MaxLength: 12
  ParentDeploymentRegion:
    Type: String
    Description: "AWS region where the Teemops parent SNS topic is deployed (TOPS_DEPLOYMENT_REGION)"
    AllowedPattern: "[a-z0-9-]+"
  ExternalId:
    Type: String
    Description: "External STS ID DO NOT CHANGE"
    AllowedPattern: "[a-zA-Z0-9-]*"
    MinLength: 10
    MaxLength: 200
  UniqueId:
    Type: String
    Description: "Unique GUID DO NOT CHANGE"
    AllowedPattern: "[a-zA-Z0-9-]*"
    MinLength: 10
    MaxLength: 200
  # RootAccountHash:
  #   Type: String
  #   Description: "Root Tops Account Hash DO NOT CHANGE. Used for SNS topic sending to root account."
  #   AllowedPattern: "[a-zA-Z0-9-]*"
  #   MinLength: 10
  #   MaxLength: 200
Resources:
  TopsCustomNotifier:
    Type: Custom::TeemopsPingSNS
    Version: 1.0
    Properties:
      ServiceToken: !Join
        - ""
        - - "arn:aws:sns:"
          - !Ref ParentDeploymentRegion
          - ":"
          - !Ref ParentAWSAccountId
          - ":teemops-sns"
      TopsRoleArn: !GetAtt
        - TeemOps
        - Arn
      TopsExternalId: !Ref ExternalId
      TopsUniqueId: !Ref UniqueId
      TopsType: "ops"
      # TopsRootAccountHash: !Ref RootAccountHash
  TopsCWEventRole:
    Type: "AWS::IAM::Role"
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "events.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Policies:
        - PolicyDocument:
            Statement:
              - Action:
                  - "Events:PutEvents"
                Effect: Allow
                Resource:
                  Fn::Join:
                    - ""
                    - - "arn:aws:events:*:"
                      - !Ref ParentAWSAccountId
                      - ":event-bus/default"
          PolicyName: CWPutEventsTeemOpsPolicy
  TeemOps:
    Type: "AWS::IAM::Role"
    Properties:
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/ReadOnlyAccess"
        - "arn:aws:iam::aws:policy/ResourceGroupsandTagEditorReadOnlyAccess"
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - "sts:AssumeRole"
            Effect: Allow
            Principal:
              AWS: !Ref ParentAWSAccountId
            Condition:
              StringEquals:
                "sts:ExternalId": !Ref ExternalId
      Path: /
  #allow ability to passrole to another role
  PassRole:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsPassRole"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "iam:PassRole"
            Resource: "arn:aws:iam::*:role/tops*"
      Roles:
        - !Ref TeemOps
  #allow ability to create an S3 bucket for Config delivery
  S3Bucket:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsS3Bucket"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "s3:CreateBucket"
              - "s3:DeleteBucket"
              - "s3:ListAllMyBuckets"
              - "s3:ListBucket"
              - "s3:GetBucketLocation"
            Resource: "arn:aws:s3:::tops-config-*"
      Roles:
        - !Ref TeemOps
  #allow ability to create, update and delete cloudformation stacks
  CloudFormationAccess:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsCloudFormationAccess"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "cloudformation:CreateStack"
              - "cloudformation:DeleteStack"
              - "cloudformation:DescribeStacks"
              - "cloudformation:UpdateStack"
              - "cloudformation:CreateChangeSet"
              - "cloudformation:DeleteChangeSet"
              - "cloudformation:DescribeChangeSet"
              - "cloudformation:ExecuteChangeSet"
              - "cloudformation:ListChangeSets"
              - "cloudformation:ListStacks"
              - "cloudformation:ListStackResources"
              - "cloudformation:GetTemplate"
            Resource: "arn:aws:cloudformation:*:*:stack/tops*"
      Roles:
        - !Ref TeemOps
  CloudFormationListAccess:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsCloudFormationListAccess"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "cloudformation:ListStacks"
              - "cloudformation:ListStackResources"
              - "cloudformation:DescribeStacks"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create a CloudTrail trail
  CloudTrailTrail:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsCloudTrailTrail"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "cloudtrail:CreateTrail"
              - "cloudtrail:DeleteTrail"
              - "cloudtrail:DescribeTrails"
              - "cloudtrail:UpdateTrail"
              - "cloudtrail:StartLogging"
              - "cloudtrail:StopLogging"
              - "cloudtrail:GetTrailStatus"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create a CloudWatch log group
  CloudWatchLogGroup:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsCloudWatchLogGroup"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "logs:CreateLogGroup"
              - "logs:DeleteLogGroup"
              - "logs:DescribeLogGroups"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create a CloudWatch log stream
  CloudWatchLogStream:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsCloudWatchLogStream"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "logs:CreateLogStream"
              - "logs:DeleteLogStream"
              - "logs:DescribeLogStreams"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create a CloudWatch log event
  CloudWatchLogEvent:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsCloudWatchLogEvent"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "logs:PutLogEvents"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create a CloudWatch log metric filter
  CloudWatchLogMetricFilter:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsCloudWatchLogMetricFilter"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "logs:PutMetricFilter"
              - "logs:DeleteMetricFilter"
              - "logs:DescribeMetricFilters"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create config rules
  ConfigRule:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsConfigRule"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "config:PutConfigRule"
              - "config:DeleteConfigRule"
              - "config:DescribeConfigRules"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create config configuration recorders
  ConfigConfigurationRecorder:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsConfigConfigurationRecorder"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "config:PutConfigurationRecorder"
              - "config:DeleteConfigurationRecorder"
              - "config:DescribeConfigurationRecorders"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create config delivery channels
  ConfigDeliveryChannel:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsConfigDeliveryChannel"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "config:PutDeliveryChannel"
              - "config:DeleteDeliveryChannel"
              - "config:DescribeDeliveryChannels"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create config configuration aggregators
  ConfigConfigurationAggregator:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsConfigConfigurationAggregator"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "config:PutConfigurationAggregator"
              - "config:DeleteConfigurationAggregator"
              - "config:DescribeConfigurationAggregators"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create config configuration snapshots
  ConfigConfigurationSnapshot:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsConfigConfigurationSnapshot"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "config:StartConfigurationRecorder"
              - "config:StopConfigurationRecorder"
              - "config:DescribeConfigurationRecorderStatus"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create config conformance packs
  ConfigConformancePack:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsConfigConformancePack"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "config:PutConformancePack"
              - "config:DeleteConformancePack"
              - "config:DescribeConformancePacks"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create config remediation configurations
  ConfigRemediationConfiguration:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsConfigRemediationConfiguration"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "config:PutRemediationConfigurations"
              - "config:DeleteRemediationConfigurations"
              - "config:DescribeRemediationConfigurations"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to create config remediation exceptions
  ConfigRemediationExceptions:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsConfigRemediationExceptions"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "config:PutRemediationExceptions"
              - "config:DeleteRemediationExceptions"
              - "config:DescribeRemediationExceptions"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to manage security hub
  SecurityHub:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsSecurityHub"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "securityhub:*"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to manage guard duty
  GuardDuty:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsGuardDuty"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "guardduty:*"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to manage macie
  Macie:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsMacie"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "macie:*"
            Resource: "*"
      Roles:
        - !Ref TeemOps
  #allow ability to manage inspector
  Inspector:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "TopsInspector"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "inspector:*"
            Resource: "*"
      Roles:
        - !Ref TeemOps
Outputs:
  ARN:
    Description: ARN Required to complete your AWS Account Setup in TeemOps
    Value: !GetAtt
      - TeemOps
      - Arn
  Name:
    Description: >-
      Name of Role in your account which has been created to allow you to
      Start/Stop/Remove EC2, RDS, CloudWatch from your account.
    Value: !Ref TeemOps
  CWRoleArn:
    Description: IAM Role required for Cloudwatch events to be sent to root account default bus
    Value: !GetAtt
      - TopsCWEventRole
      - Arn
